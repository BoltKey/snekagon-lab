<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narration recorder</title>
<style>
  :root {
    --bg: #14171C; --surface: #1B1F26; --line: #2C323C; --ink: #E8ECF1; --muted: #8C97A5;
    --gold: #F2C14E; --red: #E5574B; --blue: #4A8FE7; --good: #5BBF7A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'Segoe UI', system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 340px 1fr; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0; }
  aside h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 6px; font-weight: 600; }
  aside button { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent;
                 color: var(--muted); padding: 5px 16px; font: 13px/1.35 inherit; cursor: pointer; }
  aside button:hover { background: var(--surface); color: var(--ink); }
  aside button[aria-current="true"] { background: #231F14; color: var(--ink); }
  aside button .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); margin-top: 4px; }
  aside button.done .dot { background: var(--good); border-color: var(--good); }
  aside button .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside button .len { font: 12px ui-monospace, Consolas, monospace; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--line); }
  header .progress { font-weight: 600; }
  header .muted, .muted { color: var(--muted); }
  header label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 260px; }
  .stage { overflow-y: auto; padding: 32px 28px; display: grid; align-content: center; gap: 22px; justify-items: center; }
  .where { font: 13px ui-monospace, Consolas, monospace; color: var(--muted); }
  .context { max-width: 62ch; color: #5d6672; font-size: 16px; }
  .current { max-width: 40ch; font-size: clamp(22px, 2.4vw, 32px); line-height: 1.45; text-wrap: pretty; }
  footer { border-top: 1px solid var(--line); padding: 14px 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  footer button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; height: 40px; padding: 0 14px; font: 500 14px inherit; cursor: pointer; }
  footer button:hover { border-color: var(--muted); }
  footer button:disabled { opacity: .4; cursor: default; }
  footer kbd { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); margin-left: 6px; }
  #rec { background: #3a1d1b; border-color: var(--red); min-width: 150px; }
  #rec.on { background: var(--red); color: #fff; }
  .meter { width: 160px; height: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--good); }
  .meter.hot i { background: var(--red); }
  #status { color: var(--muted); font-size: 14px; flex: 1 1 260px; }
  .pending { color: var(--gold); font-size: 14px; }
  aside button.camera .dot { border: 0; width: auto; height: auto; margin: 0; font-size: 11px; line-height: 1.35; }
  aside button.camera .dot::before { content: '🎥'; }
  aside button.camera .snip { font-style: italic; }
  .camera-note { display: none; padding: 8px 14px; border: 1px solid var(--blue); border-radius: 8px; color: var(--ink); background: #172234; font-size: 15px; }
  .camera-note.on { display: block; }
  .editor { width: min(100%, 62ch); display: grid; gap: 10px; }
  .editor[hidden], .current[hidden] { display: none; }
  .editor textarea { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--gold); border-radius: 8px;
                     padding: 12px 14px; font: 22px/1.45 'Segoe UI', system-ui, sans-serif; resize: vertical; }
  .edit-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; }
  .edit-actions button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; }
  .edit-actions kbd { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); margin-left: 6px; }
</style>
</head>
<body>
<aside id="list" aria-label="Beats"></aside>
<main>
  <header>
    <span class="progress" id="progress">loading…</span>
    <span class="muted" id="total"></span>
    <label>Microphone <select id="mic"></select></label>
    <label><input type="checkbox" id="auto" checked> next beat after saving</label>
    <span class="pending" id="pending" hidden></span>
  </header>
  <section class="stage">
    <div class="where" id="where"></div>
    <div class="camera-note" id="cameraNote">🎥 On camera: this passage is recorded as video, not here.</div>
    <div class="context" id="prev"></div>
    <div class="current" id="text"></div>
    <div class="editor" id="editor" hidden>
      <textarea id="draft" rows="6" aria-label="Text of this beat"></textarea>
      <div class="edit-actions">
        <button id="saveText" type="button">Save text<kbd>Ctrl+Enter</kbd></button>
        <button id="cancelText" type="button">Cancel<kbd>Esc</kbd></button>
        <span class="muted">Saved edits go into the video's script right away; Claude copies them into the doc.</span>
      </div>
    </div>
    <div class="context" id="next"></div>
  </section>
  <footer>
    <button id="rec" type="button">● Record<kbd>Space</kbd></button>
    <div class="meter" id="meter" title="input level"><i></i></div>
    <button id="play" type="button">Play take<kbd>P</kbd></button>
    <button id="tts" type="button">Synthetic voice<kbd>T</kbd></button>
    <button id="back" type="button">←</button>
    <button id="fwd" type="button">→</button>
    <button id="todo" type="button">Next unrecorded<kbd>N</kbd></button>
    <button id="del" type="button">Delete take</button>
    <button id="edit" type="button">Edit text<kbd>E</kbd></button>
    <button id="discard" type="button" disabled>Discard take<kbd>Esc</kbd></button>
    <button id="restart" type="button" disabled>Restart take<kbd>R</kbd></button>
    <button id="retry" type="button" hidden>Retry save</button>
    <span id="status"></span>
  </footer>
</main>
<script>
  // one beat = one narrated piece of text; each is recorded on its own and saved as recordings/<key>.wav
  let beats = [], idx = 0, stream = null, recorder = null, chunks = [], started = 0, timer = null, audio = null;
  const $ = id => document.getElementById(id);
  const clock = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
  const sceneName = s => s.replace(/^Ch0?(\d+)/, '$1 · ').replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2');
  try { idx = Number(localStorage.getItem('beat') || 0); } catch (e) {}

  let editing = false;

  async function load() {
    const data = await (await fetch('/beats')).json();
    beats = data.beats;
    showPending(data.pendingEdits);
    idx = Math.min(idx, beats.length - 1);
    drawList();
    show(idx);
  }

  function showPending(n) {
    $('pending').hidden = !n;
    $('pending').textContent = n + (n === 1 ? ' text edit' : ' text edits') + ' waiting to be copied into the script doc';
  }

  // small text edits: they go into the video's script right away, and wait for Claude to copy them into the doc
  function startEdit() {
    if (recorder || editing) return;
    if (beats[idx].editable === false) {
      $('status').textContent = 'This text is written in the video’s code (a quote or the countdown), not in the script: ask Claude to change it.';
      return;
    }
    editing = true;
    $('draft').value = beats[idx].text;
    $('text').hidden = true;
    $('editor').hidden = false;
    $('draft').focus();
  }

  function stopEdit() {
    editing = false;
    $('editor').hidden = true;
    $('text').hidden = false;
  }

  async function saveEdit(confirmed) {
    const b = beats[idx];
    const res = await fetch('/edit?key=' + b.key + (confirmed ? '&confirm=1' : ''), { method: 'POST', body: $('draft').value });
    const out = await res.json();
    if (!res.ok) { $('status').textContent = 'Not saved: ' + (out.error || res.status); return; }
    if (out.needsConfirm) {
      const ok = confirm('These phrases are what the animation is synced to:\n\n' + out.needsConfirm.map(p => '“' + p + '”').join('\n') +
                         '\n\nAfter this change Claude has to adjust the code before the next render. Save anyway?');
      if (ok) saveEdit(true);
      return;
    }
    Object.assign(b, out.beat);
    b.button.querySelector('.snip').textContent = b.text;
    showPending(out.pendingEdits);
    stopEdit();
    show(idx);
    $('status').textContent = 'Text saved. ' + (b.recorded ? '' : 'Record this beat again. ') + $('status').textContent;
  }

  function drawList() {
    const list = $('list');
    list.innerHTML = '';
    let scene = null;
    beats.forEach((b, k) => {
      if (b.scene !== scene) {
        scene = b.scene;
        const h = document.createElement('h2');
        h.textContent = sceneName(scene);
        list.appendChild(h);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML = '<span class="dot"></span><span class="snip"></span><span class="len"></span>';
      btn.querySelector('.snip').textContent = b.text;
      btn.addEventListener('click', () => show(k));
      b.button = btn;
      list.appendChild(btn);
    });
    refresh();
  }

  function refresh() {
    let done = 0, secs = 0;
    const voice = beats.filter(b => !b.camera).length, camera = beats.length - voice;
    beats.forEach((b, k) => {
      b.button.classList.toggle('done', !!b.recorded);
      b.button.classList.toggle('camera', !!b.camera);
      b.button.setAttribute('aria-current', k === idx ? 'true' : 'false');
      b.button.querySelector('.len').textContent = b.recorded ? clock(b.recorded) : '';
      if (b.recorded && !b.camera) { done++; secs += b.recorded; }
    });
    $('progress').textContent = done + ' / ' + voice + ' beats recorded' + (camera ? ' (+ ' + camera + ' on camera)' : '');
    $('total').textContent = clock(secs) + ' of narration so far';
  }

  function show(k) {
    if (recorder) return;
    if (editing) stopEdit();
    idx = Math.max(0, Math.min(beats.length - 1, k));
    try { localStorage.setItem('beat', idx); } catch (e) {}
    const b = beats[idx];
    $('where').textContent = sceneName(b.scene) + ' · beat ' + (idx + 1) + ' of ' + beats.length;
    $('cameraNote').classList.toggle('on', !!b.camera);
    $('prev').textContent = idx > 0 && beats[idx - 1].scene === b.scene ? beats[idx - 1].text : '';
    $('text').textContent = b.text;
    $('next').textContent = idx < beats.length - 1 && beats[idx + 1].scene === b.scene ? beats[idx + 1].text : '';
    $('status').textContent = (b.recorded ? 'Recorded: ' + b.recorded.toFixed(1) + ' s. ' : 'Not recorded yet. ') + 'Synthetic voice: ' + b.ttsDuration.toFixed(1) + ' s.';
    $('play').disabled = !b.recorded;
    $('del').disabled = !b.recorded;
    $('edit').disabled = b.editable === false;
    $('edit').title = b.editable === false ? 'This text is written in the video’s code (a quote or the countdown): ask Claude to change it' : '';
    refresh();
    b.button.scrollIntoView({ block: 'nearest' });
  }

  async function openMic() {
    if (stream) return stream;
    const id = $('mic').value;
    // raw microphone: no browser echo cancellation, noise suppression or automatic gain
    stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: id ? { exact: id } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    const ctx = new AudioContext();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Float32Array(analyser.fftSize);
    (function tick() {
      analyser.getFloatTimeDomainData(data);
      let peak = 0, sum = 0;
      for (const v of data) { peak = Math.max(peak, Math.abs(v)); sum += v * v; }
      const rms = Math.sqrt(sum / data.length);
      $('meter').firstElementChild.style.width = Math.min(100, rms * 400) + '%';
      $('meter').classList.toggle('hot', peak > 0.97);
      requestAnimationFrame(tick);
    })();
    await listMics();
    return stream;
  }

  async function listMics() {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    const sel = $('mic'), current = sel.value || (stream && stream.getAudioTracks()[0].getSettings().deviceId);
    sel.innerHTML = '';
    devices.forEach(d => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || 'microphone';
      sel.appendChild(o);
    });
    if (current) sel.value = current;
  }

  async function toggle() {
    if (editing) return;
    if (recorder) { recorder.stop(); return; }
    await openMic();
    chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 256000 });
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => (dropping ? dropped() : save());
    $('discard').disabled = $('restart').disabled = false;
    recorder.start();
    started = performance.now();
    $('rec').classList.add('on');
    timer = setInterval(() => { $('rec').firstChild.textContent = '■ Stop ' + ((performance.now() - started) / 1000).toFixed(1) + ' s'; }, 100);
  }

  function recordingOff() {
    clearInterval(timer);
    recorder = null;
    $('rec').classList.remove('on');
    $('rec').firstChild.textContent = '● Record';
    $('discard').disabled = $('restart').disabled = true;
  }

  // a take that went wrong: stop without saving (Esc), or throw it away and start again right away (R)
  let dropping = null;
  function drop(again) {
    if (!recorder) return;
    dropping = again ? 'restart' : 'discard';
    recorder.stop();
  }

  function dropped() {
    const again = dropping === 'restart';
    dropping = null;
    recordingOff();
    $('status').textContent = again ? 'Take discarded, recording again…' : 'Take discarded. Press Space to record again.';
    if (again) toggle();
  }

  // a take the server has not confirmed yet: kept here, so it can be sent again if the server was not running
  let unsaved = null;

  async function save() {
    recordingOff();
    unsaved = { beat: beats[idx], blob: new Blob(chunks, { type: 'audio/webm' }) };
    await upload();
  }

  async function upload() {
    if (!unsaved) return;
    const b = unsaved.beat;
    $('status').textContent = 'Saving…';
    $('retry').hidden = true;
    let res, out;
    try {
      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), 90000);
      res = await fetch('/save?key=' + b.key, { method: 'POST', body: unsaved.blob, signal: stop.signal });
      clearTimeout(timer);
      out = await res.json();
    } catch (e) {
      $('status').textContent = 'The recorder server did not answer, so this take is not saved yet. Start the server again, then press Retry save.';
      $('retry').hidden = false;
      return;
    }
    if (!res.ok) { $('status').textContent = 'Could not save: ' + (out.error || res.status); $('retry').hidden = false; return; }
    unsaved = null;
    b.recorded = out.recorded;
    if (beats[idx] === b && $('auto').checked && idx < beats.length - 1) show(idx + 1); else show(idx);
    $('status').textContent = 'Saved ' + b.recorded.toFixed(1) + ' s. ' + $('status').textContent;
  }

  function play(url) {
    if (audio) audio.pause();
    audio = new Audio(url + '&t=' + Date.now());
    audio.play();
  }

  $('rec').addEventListener('click', toggle);
  $('play').addEventListener('click', () => play('/audio?key=' + beats[idx].key));
  $('tts').addEventListener('click', () => play('/tts?key=' + beats[idx].key));
  $('back').addEventListener('click', () => show(idx - 1));
  $('fwd').addEventListener('click', () => show(idx + 1));
  $('todo').addEventListener('click', () => {
    const todo = b => !b.recorded && !b.camera;  // on-camera passages are recorded as video
    const k = beats.findIndex((b, j) => j > idx && todo(b));
    show(k >= 0 ? k : beats.findIndex(todo));
  });
  $('del').addEventListener('click', async () => {
    const b = beats[idx];
    if (!confirm('Delete the recording of this beat?')) return;
    await fetch('/delete?key=' + b.key, { method: 'POST' });
    b.recorded = null;
    show(idx);
  });
  $('mic').addEventListener('change', () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } openMic(); });
  $('edit').addEventListener('click', startEdit);
  $('discard').addEventListener('click', () => drop(false));
  $('retry').addEventListener('click', upload);
  window.addEventListener('beforeunload', e => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
  $('restart').addEventListener('click', () => drop(true));
  $('saveText').addEventListener('click', () => saveEdit(false));
  $('cancelText').addEventListener('click', stopEdit);
  $('draft').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEdit(false); }
    else if (e.key === 'Escape') { e.preventDefault(); stopEdit(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); startEdit(); return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (recorder && e.key === 'Escape') { e.preventDefault(); drop(false); }
    else if (recorder && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); drop(true); }
    else if (recorder) return;
    else if (e.key === 'ArrowRight' || e.key === 'Enter') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'p' || e.key === 'P') $('play').click();
    else if (e.key === 't' || e.key === 'T') $('tts').click();
    else if (e.key === 'n' || e.key === 'N') $('todo').click();
  });
  navigator.mediaDevices.enumerateDevices().then(listMics).catch(() => {});
  load();
</script>
</body>
</html>
